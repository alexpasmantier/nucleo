[package]
name = "television-nucleo"
description = "plug and play high performance fuzzy matcher"
authors = [
  "Pascal Kuthe <pascalkuthe@pm.me>",
  "Alexandre Pasmantier <alex.pasmant@gmail.com>",
]
version = "0.5.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/alexpasmantier/nucleo"
readme = "README.md"
exclude = ["/typos.toml", "/tarpaulin.toml"]

[lib]
name = "nucleo"

[dependencies]
nucleo-matcher = { version = "0.3.1", path = "matcher", package = "television-nucleo-matcher" }
parking_lot = { version = "0.12.5", features = ["send_guard", "arc_lock"] }
rayon = "1.11.0"

[workspace]
members = ["matcher", "bench"]
