[package]
name = "television-nucleo-matcher"
description = "plug and play high performance fuzzy matcher"
authors = [
  "Pascal Kuthe <pascalkuthe@pm.me>",
  "Alexandre Pasmantier <alex.pasmant@gmail.com>",
]
version = "0.3.1"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/alexpasmantier/nucleo"
readme = "../README.md"

[lib]
name = "nucleo_matcher"

[dependencies]
memchr = "2.8.0"
unicode-segmentation = { version = "1.12", optional = true }

[features]
default = ["unicode-normalization", "unicode-casefold", "unicode-segmentation"]
unicode-normalization = []
unicode-casefold = []
unicode-segmentation = ["dep:unicode-segmentation"]
